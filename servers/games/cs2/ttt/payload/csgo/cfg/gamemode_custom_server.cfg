// ============================================================================
// EdgeGamers CS2 - Trouble in Terrorist Town
// gamemode_custom_server.cfg
// ============================================================================


// ---------------------------------------------------------------------------
// Plugin Input
// ---------------------------------------------------------------------------

// TTT plugins use player pings as an input mechanism.
sv_cheats 1
player_ping_token_cooldown 0
sv_cheats 0


// ---------------------------------------------------------------------------
// Movement
// ---------------------------------------------------------------------------

sv_airaccelerate 120


// ---------------------------------------------------------------------------
// Teams
// ---------------------------------------------------------------------------

// TTT owns team/role behavior.
mp_autoteambalance 0
mp_limitteams 0

mp_force_pick_time 0
sv_disable_show_team_select_menu 0

// TTT treats normal teammates as potential enemies.
mp_teammates_are_enemies 1

// Native no-block behavior.
mp_solid_teammates 0
mp_solid_enemies 0

// TTT requires players to be able to damage one another.
mp_friendlyfire 1
ff_damage_reduction_bullets 1


// ---------------------------------------------------------------------------
// Voice
// ---------------------------------------------------------------------------

// Living players may communicate across teams.
// Dead-player voice is additionally controlled by the TTT plugin.

sv_alltalk 0
sv_full_alltalk 0
sv_auto_full_alltalk_during_warmup_half_end 0

sv_deadtalk 0
sv_talk_enemy_living 1
sv_talk_enemy_dead 0


// ---------------------------------------------------------------------------
// Round Rules
// ---------------------------------------------------------------------------

// TTT completely owns round-win determination.
mp_ignore_round_win_conditions 1

mp_equipment_reset_rounds 1

mp_halftime 0
mp_match_can_clinch 0
mp_maxrounds 0

mp_freezetime 0
mp_round_restart_delay 5

mp_roundtime 6
mp_roundtime_defuse 6
mp_roundtime_hostage 6

mp_timelimit 25
mp_warmuptime 30

mp_join_grace_time 10


// ---------------------------------------------------------------------------
// Spectating
// ---------------------------------------------------------------------------

spec_freeze_time 0
spec_replay_enable 0
mp_forcecamera 0


// ---------------------------------------------------------------------------
// Economy
// ---------------------------------------------------------------------------

// TTT uses CS's buy system as infrastructure rather than a normal economy.

mp_buytime 600
mp_buy_anywhere 1

mp_startmoney 100000
mp_maxmoney 100000
mp_afterroundmoney 100000

mp_playercashawards 0
mp_teamcashawards 0
mp_free_armor 0

contributionscore_kill 0
contributionscore_assist 0


// ---------------------------------------------------------------------------
// Equipment
// ---------------------------------------------------------------------------

mp_t_default_secondary "weapon_glock"
mp_ct_default_secondary "weapon_glock"

mp_death_drop_defuser 1
mp_defuser_allocation 0

mp_death_drop_c4 0
mp_give_player_c4 0

// TTT may provide C4 through its own gameplay systems.
mp_plant_c4_anywhere 1
mp_c4timer 30

mp_respawn_immunitytime 0
mp_spawnprotectiontime 0


// ---------------------------------------------------------------------------
// Weapons / Grenades
// ---------------------------------------------------------------------------

mp_drop_grenade_enable 1

ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 4

mp_weapons_allow_map_placed 1

// NOTE:
// The old server.cfg specified -1, but gamemode_custom_server.cfg executes
// afterward and currently changes this to 2. Therefore 2 is the actual
// existing runtime behavior and is preserved here.
mp_weapons_allow_typecount 2

mp_weapons_allow_zeus 1
mp_taser_recharge_time 60

// TTT normally has somewhat more dropped weapon activity than Jailbreak.
weapon_max_before_cleanup 25

weapon_reticle_knife_show 1


// ---------------------------------------------------------------------------
// Radar
// ---------------------------------------------------------------------------

sv_disable_radar 1