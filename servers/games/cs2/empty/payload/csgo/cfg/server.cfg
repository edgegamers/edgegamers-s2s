// ============================================================================
// EdgeGamers CS2 - Global Server Configuration
//
// ONLY settings that apply to every EdgeGamers CS2 server belong here.
// Gamemode behavior belongs in gamemode_custom_server.cfg.
// Map-specific exceptions belong in the map cfg.
// ============================================================================

// ---------------------------------------------------------------------------
// Server Visibility
// ---------------------------------------------------------------------------

sv_lan 0
sv_region -1


// ---------------------------------------------------------------------------
// Downloads
// ---------------------------------------------------------------------------

// Custom content is distributed through Steam/Workshop.
sv_allowdownload 0


// ---------------------------------------------------------------------------
// EdgeGamers Policy
// ---------------------------------------------------------------------------

// Voting is handled by EdgeGamers plugins.
sv_allow_votes 0

// EdgeGamers moderation takes precedence over Valve communication penalties.
sv_mute_players_with_social_penalties 0

// AFK/team-damage enforcement is handled by EdgeGamers plugins.
mp_autokick 0
mp_disable_autokick

// Servers cannot be paused through normal engine behavior.
sv_pausable 0

// Explicit safe default. Individual gamemode cfgs may temporarily enable this
// when changing cheat-protected configuration values.
sv_cheats 0


// ---------------------------------------------------------------------------
// Spectators
// ---------------------------------------------------------------------------

mp_spectators_max 64


// ---------------------------------------------------------------------------
// Hibernation
// ---------------------------------------------------------------------------

// Intentionally disabled. problems with servers correctly recovering 
// from hibernation.
sv_hibernate_when_empty 0


// ---------------------------------------------------------------------------
// Map / Match Lifecycle
// ---------------------------------------------------------------------------

// Map rotation is owned by the rtv plugin.
mp_endmatch_votenextmap 0
mp_endmatch_votenextmap_keepcurrent 0
mp_match_end_changelevel 0
mp_match_end_restart 0

// ---------------------------------------------------------------------------
// Bots
// ---------------------------------------------------------------------------

// Bots are disabled by default. Individual gamemode cfgs may enable them.
bot_chatter "off"
bot_difficulty 1
bot_join_after_player 0
bot_quota 0
bot_quota_mode "normal"

// ---------------------------------------------------------------------------
// Logging
// ---------------------------------------------------------------------------

// Logs are consumed through container.
log on
sv_logfile 0