name: Main Source2Script Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-s2s-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    name: Validate and deploy changed packages
    runs-on: ubuntu-latest
    environment: production
    outputs:
      has-changesets: ${{ steps.detect.outputs.has-changesets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Source2Script workspace
        run: npm run build

      - name: Build production server bundles
        run: npm run bundles:servers -- --environment production

      - name: Publish production server bundle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SERVER_BUNDLE_RELEASE_TAG=latest
          git tag -f "$SERVER_BUNDLE_RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$SERVER_BUNDLE_RELEASE_TAG"
          if gh release view "$SERVER_BUNDLE_RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$SERVER_BUNDLE_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Latest server bundles" \
              --notes "Latest released server bundles." \
              --latest
          else
            gh release create "$SERVER_BUNDLE_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Latest server bundles" \
              --notes "Latest released server bundles." \
              --latest
          fi
          gh release upload "$SERVER_BUNDLE_RELEASE_TAG" \
            artifacts/server-bundles/bundles.json \
            artifacts/server-bundles/*/*/*.zip \
            artifacts/server-bundles/*/*/*.zip.sha256 \
            --clobber

      - name: Detect pending Changesets
        id: detect
        run: |
          if find .changeset -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Source2Script packages
        if: steps.detect.outputs.has-changesets == 'true'
        env:
          S2SCRIPT_TOKEN: ${{ secrets.S2SCRIPT_TOKEN }}
        run: npm run deploy -- --ci

      - name: Skip Source2Script deploy
        if: steps.detect.outputs.has-changesets != 'true'
        run: echo "No pending Changesets; skipping s2s deploy."
