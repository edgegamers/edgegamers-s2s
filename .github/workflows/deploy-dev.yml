name: Build Development Artifacts

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build development artifacts
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Source2Script workspace
        run: npm run build

      - name: Generate development manifest
        run: npm run manifest:dev

      - name: Collect local development artifacts
        run: npm run artifacts:local

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-development-${{ github.sha }}
          path: |
            artifacts/development-manifest.json
            artifacts/local-development/
          if-no-files-found: error
          retention-days: 14

      - name: Write development SSH key
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/edgegamers-development
          chmod 600 ~/.ssh/edgegamers-development

      - name: Deploy development plugins
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY_PATH: ~/.ssh/edgegamers-development
          DEV_S2SCRIPT_PLUGIN_DIR: ${{ secrets.DEV_S2SCRIPT_PLUGIN_DIR }}
          DEV_SERVER_GAME: ${{ vars.DEV_SERVER_GAME }}
          DEV_SERVER_NAME: ${{ vars.DEV_SERVER_NAME }}
        run: npm run deploy:dev
