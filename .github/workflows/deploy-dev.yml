name: Build Development Artifacts

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build development artifacts
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Source2Script workspace
        run: npm run build

      - name: Build development server bundles
        run: npm run bundles:servers -- --environment development

      - name: Publish development server bundle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SERVER_BUNDLE_RELEASE_TAG=dev-latest
          git tag -f "$SERVER_BUNDLE_RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$SERVER_BUNDLE_RELEASE_TAG"
          if gh release view "$SERVER_BUNDLE_RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$SERVER_BUNDLE_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Development server bundles" \
              --notes "Latest development server bundles." \
              --prerelease \
              --latest=false
          else
            gh release create "$SERVER_BUNDLE_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Development server bundles" \
              --notes "Latest development server bundles." \
              --prerelease \
              --latest=false
          fi
          gh release upload "$SERVER_BUNDLE_RELEASE_TAG" \
            artifacts/server-bundles/bundles.json \
            artifacts/server-bundles/*/*/*.zip \
            artifacts/server-bundles/*/*/*.zip.sha256 \
            --clobber

      - name: Trigger development server pipelines
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          PLUGIN_BUNDLE_RELEASE_TAG: dev-latest
          GITLAB_PROJECT_ID_EMPTY_S2S: ${{ secrets.GITLAB_PROJECT_ID_EMPTY_S2S }}
          GITLAB_TRIGGER_TOKEN_EMPTY_S2S: ${{ secrets.GITLAB_TRIGGER_TOKEN_EMPTY_S2S }}
          GITLAB_PROJECT_ID_TTT_S2S: ${{ secrets.GITLAB_PROJECT_ID_TTT_S2S }}
          GITLAB_TRIGGER_TOKEN_TTT_S2S: ${{ secrets.GITLAB_TRIGGER_TOKEN_TTT_S2S }}
        run: npm run trigger:servers -- --environment development --ref dev
