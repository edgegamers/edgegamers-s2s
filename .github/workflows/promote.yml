name: Promote dev

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: promote-dev
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open the batch release PR
        uses: actions/github-script@v9
        with:
          script: |
            const promote = require('./.github/scripts/promote.cjs');
            await promote({ github, context, core });
