name: Snapshot

# Every push to a pull request publishes a development snapshot of the packages
# it changes, as 0.0.0-dev.<run>.pr<number>.g<sha>. Stable versions always sort
# above those, so they never become latest, never match a ^ range and are never
# auto-updated to. Install one by exact version to test it. Stable releases stay
# with release.yml on main.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  snapshot:
    # Forks get no registry token, and the version PR only carries stable versions.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      # The last successful snapshot of this PR, so a push only publishes what changed since.
      - name: Restore snapshot checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .snapshot-state
          key: snapshot-pr${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: snapshot-pr${{ github.event.pull_request.number }}-
      # The snapshot edits stay in this checkout and are never committed.
      - name: Version snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id="dev.${GITHUB_RUN_NUMBER}.pr${PR}.g${HEAD_SHA:0:12}"
          state=.snapshot-state/state.json
          prev=""
          if [ -f "$state" ]; then prev=$(jq -r .source "$state"); fi
          # The checkpoint can be refused, for example when a package was removed since it, so a
          # refused incremental snapshot falls back to a full one from the base.
          if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD \
            && npx s2s version --snapshot "$id" --since "$prev" --snapshot-state "$state" --output "$RUNNER_TEMP/snapshot.json"; then
            echo "Snapshotted since the last snapshot of this PR ($prev)"
          else
            echo "Snapshotting since the base (first snapshot, rewritten history, or a refused checkpoint)"
            git checkout -- .
            npx s2s version --snapshot "$id" --since "$(git merge-base "$BASE_SHA" HEAD)" --output "$RUNNER_TEMP/snapshot.json"
          fi
      - name: Build and publish
        run: node scripts/snapshot.mjs "$RUNNER_TEMP/snapshot.json"
        env:
          S2SCRIPT_TOKEN: ${{ secrets.S2SCRIPT_TOKEN }}
      # Only after a successful publish, so a failed run is retried from the same checkpoint.
      - name: Keep snapshot checkpoint
        run: mkdir -p .snapshot-state && cp "$RUNNER_TEMP/snapshot.json" .snapshot-state/state.json
      - uses: actions/cache/save@v4
        with:
          path: .snapshot-state
          key: snapshot-pr${{ github.event.pull_request.number }}-${{ github.run_id }}
