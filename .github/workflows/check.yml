name: Check

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional promotion PR number to check as merged
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pull_request && format('refs/pull/{0}/merge', inputs.pull_request) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
