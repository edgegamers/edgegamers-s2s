name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the PR supersedes the run for the old head.
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The job always runs (and reports) so it can stay a required check; it
      # only skips the install, build and tests when the PR touches nothing but
      # Markdown (docs, changesets, changelogs), which no build or test reads.
      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only Markdown changed; skipping build and tests"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        run: npm install --global npm@11.19.0
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run check
